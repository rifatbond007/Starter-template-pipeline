# This is a placeholder — you must generate this with kubeseal on your actual cluster.
# See guides/secrets-management.md for step-by-step instructions.
#
# After generating, this file gets committed to the GitOps repo.
# The Sealed Secrets controller on the cluster will decrypt it into a regular Secret.
#
# Example structure (yours will differ because the encryption key is cluster-specific):
#
# apiVersion: bitnami.com/v1alpha1
# kind: SealedSecret
# metadata:
#   name: app-secrets
#   namespace: hackathon
# spec:
#   encryptedData:
#     DATABASE_URL: AgBy123...encrypted-blob...
#     API_KEY: AgBc456...encrypted-blob...

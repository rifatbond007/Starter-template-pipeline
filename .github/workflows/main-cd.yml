name: Main CD — Build, Push, Update Manifests

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  TURBO_TELEMETRY_DISABLED: 1
  DOCKER_REGISTRY: docker.io
  DOCKER_ORG: rifatbroh

jobs:
  build-client:
    name: Build & Push Client
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tags.outputs.full_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: npx turbo build --filter=@hackathon/client

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_ORG }}/hackathon-client
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=raw,value=${{ github.sha }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/client/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - id: tags
        run: |
          echo "full_tag=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_ORG }}/hackathon-client:${{ github.sha }}" >> $GITHUB_OUTPUT

  build-server:
    name: Build & Push Server
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tags.outputs.full_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: npx turbo build --filter=@hackathon/server

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_ORG }}/hackathon-server
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=raw,value=${{ github.sha }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - id: tags
        run: |
          echo "full_tag=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_ORG }}/hackathon-server:${{ github.sha }}" >> $GITHUB_OUTPUT

  update-manifests:
    name: Update Deployments in Repo
    needs: [build-client, build-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_PAT }}

      - uses: mikefarah/yq@master
        with:
          cmd: |
            yq eval '.spec.template.spec.containers[0].image = "${{ needs.build-client.outputs.image_tag }}"' -i k8s/manifests/client-deployment.yaml

      - uses: mikefarah/yq@master
        with:
          cmd: |
            yq eval '.spec.template.spec.containers[0].image = "${{ needs.build-server.outputs.image_tag }}"' -i k8s/manifests/server-deployment.yaml

      - run: |
          git config user.name "rifatbond007"
          git config user.email "abdullah.al.rifat2239@gmail.com"
          git add k8s/manifests/
          git diff --staged --quiet || (git commit -m "chore: update image tags for ${{ github.sha }} [skip ci]" && git push)
